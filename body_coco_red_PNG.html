<script>
// Interruptor exclusivo de la vista previa web. El HTML V7 de correo permanece intacto.
const CONFIG = { mostrarBotonDescarga: true, nombreArchivo: 'Mi_Retribucion_Variable_COCO.png', escalaExportacion: 2 };
const frame=document.getElementById('emailFrame');
const button=document.getElementById('download');
const toolbar=document.getElementById('toolbar');
const status=document.getElementById('status');
if(!CONFIG.mostrarBotonDescarga) toolbar.classList.add('hidden');
function ajustarAlto(){
  const doc=frame.contentDocument;
  if(!doc)return;
  frame.style.height=Math.ceil(Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight))+4+'px';
}
async function esperarImagenes(doc){
  await Promise.all(Array.from(doc.images).map(async img=>{
    if(!img.complete)await new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});});
    if(!img.naturalWidth)throw new Error('Una imagen no pudo cargarse: '+img.src);
  }));
  if(doc.fonts&&doc.fonts.ready)await doc.fonts.ready;
}
button.addEventListener('click',async()=>{
  button.disabled=true;status.textContent='Preparando la exportación…';
  try{
    if(typeof html2canvas!=='function')throw new Error('No se cargó la librería de exportación.');
    const doc=frame.contentDocument;
    await esperarImagenes(doc);
    ajustarAlto();
    // Se captura la tabla de 640px, no la interfaz ni el fondo de previsualización.
    const table=doc.querySelector('table[width="640"]');
    if(!table)throw new Error('No se encontró la tabla principal de la comunicación.');
    const canvas=await html2canvas(table,{backgroundColor:'#FFFFFF',scale:CONFIG.escalaExportacion,useCORS:true,allowTaint:false,logging:false,scrollX:0,scrollY:0,windowWidth:750});
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw new Error('No fue posible producir el PNG.');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=CONFIG.nombreArchivo;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    status.textContent='PNG generado. Comprueba que las imágenes se hayan incluido correctamente.';
  }catch(e){
    status.textContent='No se pudo exportar: '+e.message+' Si es por CORS del CDN, usa una captura de navegador o habilita CORS en el alojamiento de imágenes.';
  }finally{button.disabled=false;}
});
</script></body></html>
